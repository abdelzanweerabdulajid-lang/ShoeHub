<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register - ShoeHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container{max-width:420px;margin:60px auto;padding:28px;border-radius:14px}
        .auth-header{margin-bottom:18px}
        .auth-header h1{font-size:28px;margin:0 0 6px}
        .auth-header p{margin:0;color:rgba(255,255,255,.8)}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;margin-bottom:8px;color:rgba(255,255,255,.85);font-size:14px}
        .form-actions{display:flex;gap:12px;align-items:center}
        .muted-link{color:rgba(255,255,255,.7);text-decoration:none}
    </style>
</head>
<body>

<header>
    <div class="logo">Shoe<span>Hub</span></div>
    <div class="nav-buttons"></div>
    <button id="themeToggle" class="theme-toggle" type="button">Light</button>
</header>

<main>
    <section class="auth-container card">
        <div class="auth-header">
            <h1>Create an account</h1>
            <p>Join ShoeHub to get exclusive releases, discounts, and order tracking.</p>
        </div>

        <form id="registerForm" action="#" method="post" novalidate onsubmit="registerUser(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Create a password" required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" required minlength="8">
            </div>

            <div class="form-actions">
                <button type="submit" class="full-width">Register</button>
            </div>
            <p style="margin-top:12px; color:rgba(255,255,255,.7);">Already have an account? <a class="muted-link" href="login.html">Login</a></p>
        </form>

    </section>
</main>

<script src="script.js"></script>
</body>
</html>
